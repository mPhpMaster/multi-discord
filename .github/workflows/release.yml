name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        # The runner's packages.microsoft.com source can fail (403) and break apt-get update; NSIS doesn't need it
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.*
          sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          makensis -DVERSION="$VERSION" installer/DiscordMulti.nsi

      - name: Package portable zip
        run: |
          mkdir -p dist/MultiDiscord
          cp -r DiscordMulti.ps1 Start-DiscordMulti.bat discord-multi.sh discord-multi-mac.js assets README.md LICENSE dist/MultiDiscord/
          chmod +x dist/MultiDiscord/discord-multi.sh
          cd dist && zip -r "MultiDiscord-${GITHUB_REF_NAME}-portable.zip" MultiDiscord

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true

  mac-app:
    # The release above creates the release; this adds the macOS app to it
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Discord Multi.app
        run: bash installer/build-mac-app.sh dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          ditto -c -k --keepParent "Discord Multi.app" "DiscordMulti-${GITHUB_REF_NAME}-mac.zip"
          gh release upload "$GITHUB_REF_NAME" "DiscordMulti-${GITHUB_REF_NAME}-mac.zip" --clobber
